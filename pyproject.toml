[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freachecin-cache_hit_attribution_length_profile"
version = "0.1.0"
description = "按段落统计计算机视觉算法工程师·缓存命中率的归因相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "freachecin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://freachecin.github.io"
Repository = "https://github.com/freachecin/cache_hit_attribution_length_profile"
Issues = "https://github.com/freachecin/cache_hit_attribution_length_profile/issues"

[project.scripts]
cache_hit_attribution_length_profile = "cache_hit_attribution_length_profile:main"

[tool.setuptools]
py-modules = ["cache_hit_attribution_length_profile"]
